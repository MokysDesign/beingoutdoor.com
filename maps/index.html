<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps | being outdoor</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a class="site-title" href="../">being outdoor</a>
        <span class="tagline">Travel diary & photography</span>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="../">Home</a>
        <a href="../#off-road-adventures">Off-Road Adventures</a>
        <a href="../#road-trips">Road Trips</a>
        <a href="../#city-tours">City Tours</a>
        <a href="../about-this-blog/">About</a>
      </nav>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main class="site-main">
    <article class="container page-content">
  <h1 class="page-title">Maps</h1>
  
</article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© being outdoor — Travel diary & photography</p>
    </div>
  </footer>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.main-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        const open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Park Map — being outdoor</title>
  <meta name="description" content="Every national park we have visited, on one map. Click a pin to see the trip.">
  <meta name="theme-color" content="#2a8a8a">
  <meta property="og:title" content="National Park Map — being outdoor">
  <meta property="og:description" content="Every national park we have visited, on one map. Click a pin to see the trip.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://beingoutdoor.com/national-park-map-2/">
  <meta property="og:image" content="https://beingoutdoor.com/images/2026/07/about-lake.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="National Park Map — being outdoor">
  <meta name="twitter:description" content="Every national park we have visited, on one map. Click a pin to see the trip.">
  <meta name="twitter:image" content="https://beingoutdoor.com/images/2026/07/about-lake.jpg">
  <link rel="canonical" href="https://beingoutdoor.com/national-park-map-2/">
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a class="site-title" href="../">being outdoor</a>
        <span class="tagline">Travel diary & photography</span>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="../">Home</a>
        <a href="../#off-road-adventures">Off-Road Adventures</a>
        <a href="../#road-trips">Road Trips</a>
        <a href="../#city-tours">City Tours</a>
        <a href="../apps-i-use/">Apps I use</a>
        <a href="../about-this-blog/">About</a>
        <a href="https://surroundyou.me/shop-wall-art/" target="_blank" rel="noopener">Shop</a>
      </nav>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main class="site-main">
    <article class="container page-content">
  <h1 class="page-title">National Park Map</h1>
  <div class="map-embed"><div class="map-overlay" role="button" tabindex="0" aria-label="Click to interact with map"><span>Click to interact</span></div><iframe class="googlemaps-embed" src="https://www.google.com/maps/d/u/1/embed?mid=1DuA4tJV4I1vZw0sRarB2H6O5ioA&amp;w=640&amp;h=480" width="100%" height="480px" style="border:0;max-width:100%" allowfullscreen="" loading="lazy"></iframe></div>
</article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© being outdoor — Travel diary & photography</p>
    </div>
  </footer>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.main-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        const open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
      });
    }
    // Activate maps on click so wheel-scrolls the page
    document.querySelectorAll('.map-embed').forEach(function(el){
      var overlay = el.querySelector('.map-overlay');
      if (!overlay) return;
      overlay.addEventListener('click', function(){ el.classList.add('active'); });
    });
  </script>
</body>
</html>
